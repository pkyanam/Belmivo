name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node --test scripts/test-release-audit.mjs
      - run: node scripts/audit-release.mjs --patterns-only
      - run: bash -n scripts/*.sh
      - run: bash scripts/install.sh --no-setup
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node site/build.mjs && node site/check.mjs
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            relay/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix relay ci --ignore-scripts
      - run: npm --prefix relay test
      - run: npm --prefix relay run test:integration
